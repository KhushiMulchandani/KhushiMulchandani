name: Update GitHub Streak Stats

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Streak Stats SVG
        uses: denvercoder1/github-readme-streak-stats@v1.9.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          user: KhushiMulchandani
          theme: tokyonight
          hide_border: 'false'

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "chore: update github streak stats [skip ci]"
          git push
